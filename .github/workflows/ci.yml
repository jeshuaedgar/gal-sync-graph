name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            throw "PowerShell 7.6 or later is needed, this runner has $($PSVersionTable.PSVersion)"
          }
          Install-PSResource -Name Pester -Version 6.2.0 -Scope CurrentUser -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository -Quiet

      - name: Lint, test and package
        shell: pwsh
        run: ./build.ps1

      - name: Upload build output
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and lint templates
        run: |
          az bicep install
          az bicep build --file deploy/main.bicep --stdout > /dev/null
          az bicep build-params --file deploy/main.bicepparam --stdout > /dev/null
          az bicep lint --file deploy/main.bicep
